<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Tempo Juntos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <h1>Beatriz &amp; Raul ❤️</h1>

    <div class="carrossel">
      <button class="seta" id="btnAnterior">&#10094;</button>
      <img id="fotoAtual" src="img/foto1.jpg" alt="Foto de nós dois" class="foto">
      <button class="seta" id="btnProximo">&#10095;</button>
    </div>

    <p class="subtitulo">Estamos juntos há:</p>

    <div class="contador">
      <div><span id="dias">0</span><small>dias</small></div>
      <div><span id="horas">0</span><small>horas</small></div>
      <div><span id="minutos">0</span><small>minutos</small></div>
      <div><span id="segundos">0</span><small>segundos</small></div>
    </div>

    <button id="btnMotivo">Por que eu te amo? 💌</button>
    <p id="motivo"></p>

    <button id="btnMusica">🎵 Tocar nossa música</button>
    <audio id="musica" src="audio/musica.mp3" loop></audio>

    <p class="mensagem">EU SEMPRE VOU TE AMAR.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
